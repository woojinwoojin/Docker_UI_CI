# 이미지 하나로 두 서비스를 띄운다. 외부에는 화면(8501)만 열고, API는 compose 내부망에서만 쓴다.
services:
  api:
    build: .
    env_file: .env  # API 키는 실행할 때 전달한다 (이미지·git에는 없음)
    environment:
      APP_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data  # SQLite, 업로드 CSV — 컨테이너를 다시 만들어도 호스트에 남는다
    restart: unless-stopped
    healthcheck:
      # slim 이미지에는 curl이 없어서 Python으로 확인한다
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ui:
    build: .
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    environment:
      API_URL: http://api:8000  # 서비스 이름이 주소가 된다
    volumes:
      - ./data:/app/data:ro  # 예시 CSV만 읽는다. 화면은 API 키도 받지 않는다
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy  # API가 응답할 때까지 기다렸다가 뜬다
